# Build, verify, deploy — in that order, and the order is the point. A failing
# verify blocks the deploy, so a wrong constant never reaches the live site.
#
# This publishes to the gh-pages branch rather than using the Pages artifact
# actions, because Pages on this repo is configured to serve from a branch.
# Switching Settings → Pages → Source to "GitHub Actions" would also work, but
# this way the repo deploys correctly with no manual configuration.
name: Build, verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      # Staged outside the repo before switching branches. dist/ is gitignored
      # on main but tracked on gh-pages, so a plain checkout would clobber the
      # fresh build with the previous deploy's copy and ship yesterday's site.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          cp -r dist/. "$STAGE"/
          touch "$STAGE/.nojekyll"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1 || true
          git checkout -B gh-pages
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name node_modules -exec rm -rf {} +
          cp -r "$STAGE"/. .

          git add -A
          git commit -m "Deploy: ${{ github.event.head_commit.message }}" || { echo "nothing changed"; exit 0; }
          git push -f origin gh-pages
