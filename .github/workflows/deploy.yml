# Deploy. Only from main, only after CI passes, and only counted as successful
# once the live site is confirmed to be serving the build we just made.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never two deploys at once, and never cancel one mid-push — an interrupted
# branch update is how a deploy branch ends up in a half-written state.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  ship:
    name: Publish and confirm
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Rebuilt rather than pulled from the CI artifact, so the bytes that ship
      # come from this job's checkout and nothing can be substituted between
      # the gate and the publish.
      - name: Build
        run: npm run build

      - name: Re-verify the artifact being shipped
        run: npm run verify

      - name: Record the expected asset
        id: expect
        run: echo "js=$(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"

      # Published from a throwaway clone rather than by switching branches in
      # place. Two reasons: the working tree keeps dist/ and scripts/ intact
      # for the confirmation step below, and — the older trap — dist/ is
      # gitignored on main but tracked on gh-pages, so an in-place checkout
      # silently replaces the fresh build with the previous deploy's copy and
      # ships the build before the one you meant, with a green check.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          cp -r dist/. "$STAGE"/
          touch "$STAGE/.nojekyll"

          PUB=$(mktemp -d)
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if ! git clone --branch gh-pages --depth 1 "$REPO" "$PUB" 2>/dev/null; then
            git clone --depth 1 "$REPO" "$PUB"
            git -C "$PUB" checkout --orphan gh-pages
            git -C "$PUB" rm -rf . > /dev/null 2>&1 || true
          fi

          cd "$PUB"
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} +
          cp -r "$STAGE"/. .

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change to publish."
            exit 0
          fi
          git commit -m "Deploy ${{ github.sha }}"
          git push -f origin gh-pages

      # The check that closes the loop. A green publish means the push
      # succeeded, not that the bytes are being served. This polls the live URL
      # until index.html references the exact content-hashed asset built above,
      # then fetches that asset to confirm it is not a 404.
      - name: Confirm the live site serves this build
        run: node scripts/postdeploy.mjs --expect=${{ steps.expect.outputs.js }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Asset: \`${{ steps.expect.outputs.js }}\`"
            echo "- Live: https://abhaybhuvagithub.github.io/AIChip/"
          } >> "$GITHUB_STEP_SUMMARY"
